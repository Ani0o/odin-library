<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="icon" type="image/png" href="icons/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
</head>
<body>
    <div class="dialog-container">
        <div>
            <img src="icons/bookshelf.svg">
            <h1>Library</h1>
        </div>

        <button class="dialog-button"><img src="icons/plus.svg">New Book</button>

        <dialog>
            <form method="dialog">
                <div>
                    <label for="form-title">Title:</label>
                    <input id="form-title" type="text" name="title" required>
                </div>

                <div>
                    <label for="form-author">Author:</label>
                    <input id="form-author" type="text" name="author" required>
                </div>

                <div>
                    <label for="form-pages">Pages:</label>
                    <input id="form-pages" type="number" min="1" name="pages" required>
                </div>

                <div>
                    <p>Read:</p>

                    <input id="form-read-yes" type="radio" name="read" value="true" required>
                    <label for="form-read-yes">Yes</label>

                    <input id="form-read-no" type="radio" name="read" value="false">
                    <label for="form-read-no">No</label>
                </div>

                <button class="cancel-button" type="submit" value="cancel" formnovalidate>Cancel</button>
                <button class="submit-button" type="submit" value="submit">Add</button>
            </form>
        </dialog>
    </div>
    <div class="book-container"></div>
</body>
</html>
