<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="dialog-container">
        <button class="dialog-button">New Book</button>
        <dialog>
            <form method="dialog">
                <div>
                    <label for="form-title">Title:</label>
                    <input id="form-title" type="text" name="title" required>
                </div>

                <div>
                    <label for="form-author">Author:</label>
                    <input id="form-author" type="text" name="author" required>
                </div>

                <div>
                    <label for="form-pages">Pages:</label>
                    <input id="form-pages" type="number" min="1" name="pages" required>
                </div>

                <div>
                    <p>Read:</p>

                    <input id="form-read-yes" type="radio" name="read" value="true" required>
                    <label for="form-read-yes">Yes</label>

                    <input id="form-read-no" type="radio" name="read" value="false">
                    <label for="form-read-no">No</label>
                </div>

                <button class="cancel-button" type="submit" value="cancel" formnovalidate>Cancel</button>
                <button class="submit-button" type="submit" value="submit">Add</button>
            </form>
        </dialog>
    </div>
    <div class="book-container"></div>
</body>
</html>
